project:
  name: Tesla ML Pipeline
  version: 1.0.0

paths:
  raw_data:       data/raw/tesla_deliveries.csv
  processed_data: data/processed/features.csv
  outputs:        data/outputs/pipeline_results.json
  models_dir:     models/
  plots_dir:      frontend/plots/

data:
  synthetic: true          # set false if using real Kaggle CSV
  start_date: "2015-01-01"
  end_date:   "2025-03-01"
  freq: QS
  test_split: 0.20

feature_engineering:
  lags:          [1, 2, 4]
  rolling_windows: [4, 8]
  cyclical_period: 4

models:
  ridge:
    alpha: 10000
  lasso:
    alpha: 500
    max_iter: 10000
  random_forest:
    n_estimators: 300
    max_depth: 6
    min_samples_leaf: 2
    random_state: 42
  gradient_boosting:
    n_estimators: 300
    learning_rate: 0.04
    max_depth: 3
    subsample: 0.8
    min_samples_leaf: 2
    random_state: 42
  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 3
    subsample: 0.8
    reg_alpha: 0.5
    reg_lambda: 2
    random_state: 42
    verbosity: 0

tuning:
  param_grid:
    n_estimators:  [200, 400]
    max_depth:     [3, 4]
    learning_rate: [0.03, 0.07]
    subsample:     [0.8, 1.0]
  cv_folds: 3
  scoring: neg_mean_absolute_error

forecasting:
  method: holt_winters
  trend: add
  seasonal: add
  seasonal_periods: 4
  forecast_horizon: 8        # quarters ahead

evaluation:
  metrics: [mae, rmse, mape, r2]
  cv_folds: 5
